<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程规划 - 海航随心飞航线</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --hna-primary: #e60012;
            --hna-dark: #b0000e;
            --hna-border: #dee2e6;
            --ok: #198754;
            --warn: #dc3545;
        }
        body {
            background: #f5f6f7;
            color: #212529;
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        }
        .navbar-hna { background-color: var(--hna-primary); }
        .navbar-hna .navbar-brand { font-size: 1.05rem; }
        .panel {
            background: #fff;
            border: 1px solid var(--hna-border);
            border-radius: 4px;
            padding: .9rem 1rem;
        }
        .panel h6 { font-weight: 600; }
        .seg-card {
            border: 1px solid var(--hna-border);
            border-radius: 4px;
            padding: .6rem .7rem;
            margin-bottom: .6rem;
            background: #fafbfc;
        }
        .seg-card.seg-ok { border-left: 3px solid var(--ok); }
        .seg-card.seg-bad { border-left: 3px solid var(--warn); }
        .seg-head {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin-bottom: .45rem;
        }
        .seg-no {
            background: #e9ecef;
            color: #495057;
            font-size: .75rem;
            font-weight: 600;
            border-radius: 3px;
            padding: .05rem .45rem;
        }
        .seg-body { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
        .seg-body input[type=date] { width: 140px; font-size: .875rem; padding: .25rem .4rem; }
        .seg-arrow { color: #6c757d; }
        .seg-status { font-size: .8rem; font-weight: 600; white-space: nowrap; }
        .seg-status.ok { color: var(--ok); }
        .seg-status.bad { color: var(--warn); }
        /* 可搜索城市选择框 */
        .cbx { position: relative; flex: 1 1 120px; min-width: 110px; }
        .cbx-input { font-size: .875rem; padding: .25rem .5rem; }
        .cbx-menu {
            position: absolute; z-index: 1080; display: none; left: 0; right: 0;
            background: #fff; border: 1px solid var(--hna-border); border-radius: 4px;
            max-height: 230px; overflow-y: auto; margin-top: 2px;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
        }
        .cbx-menu.open { display: block; }
        .cbx-item { padding: .3rem .65rem; font-size: .85rem; cursor: pointer; white-space: nowrap; }
        .cbx-item:hover, .cbx-item.active { background: #fff0f1; color: var(--hna-primary); }
        .cbx-empty { padding: .4rem .65rem; font-size: .82rem; color: #999; }
        .limit-warning {
            display: none;
            background: #fff8e1; border: 1px solid #ffe082; color: #8d6e00;
            font-size: .8rem; border-radius: 4px; padding: .4rem .6rem; margin-bottom: .55rem;
        }
        .limit-warning.show { display: block; }
        .alt-chip {
            font-size: .8rem; padding: .15rem .55rem; border-radius: 3px;
            border: 1px solid #b7dfc9; background: #f1f9f4; color: #146c43; cursor: pointer;
        }
        .alt-chip:hover { background: #d1e7dd; }
        .transit-card {
            border: 1px solid var(--hna-border); border-radius: 4px;
            padding: .55rem .65rem; margin-bottom: .5rem; background: #fafbfc;
        }
        .transit-card.t-level2 { border-left: 3px solid var(--ok); }
        .transit-card.t-level1 { border-left: 3px solid #fd7e14; }
        .transit-leg { font-size: .82rem; }
        .transit-leg .leg-title { color: #6c757d; font-size: .78rem; }
        .t-badge { font-size: .72rem; font-weight: 700; padding: .08rem .4rem; border-radius: 3px; white-space: nowrap; }
        .t-badge.lv2 { background: #d1e7dd; color: #0f5132; }
        .t-badge.lv1 { background: #ffe5d0; color: #984c0c; }
        .t-badge.lv0 { background: #e9ecef; color: #6c757d; }
        .mini-table { font-size: .8rem; margin-bottom: .25rem; }
        .mini-table td, .mini-table th { padding: .12rem .35rem !important; white-space: nowrap; }
        .mini-table tr.row-ok td { background: #f1f9f4; }
        .btn-hna { background-color: var(--hna-primary); color: #fff; border-color: var(--hna-primary); }
        .btn-hna:hover { background-color: var(--hna-dark); border-color: var(--hna-dark); color: #fff; }
        .btn-outline-hna { color: var(--hna-primary); border-color: var(--hna-primary); }
        .btn-outline-hna:hover { background-color: var(--hna-primary); color: #fff; }
        .product-chip-group .btn { padding: .2rem .8rem; }
        .chain-box {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .35rem;
            font-size: .9rem;
        }
        .chain-city { font-weight: 600; }
        .chain-mark { font-size: .8rem; }
        .chain-mark.ok { color: var(--ok); }
        .chain-mark.bad { color: var(--warn); }
        .result-card { margin-bottom: .8rem; }
        .table-planner { font-size: .85rem; margin-bottom: 0; }
        .table-planner th { background: #f8f9fa; font-weight: 600; color: #495057; white-space: nowrap; }
        .table-planner td { vertical-align: middle; white-space: nowrap; }
        tr.row-ok { background: #f1f9f4; }
        tr.row-ok td:first-child { border-left: 3px solid var(--ok); }
        tr.row-outrange td { color: #adb5bd; }
        .day-badge { font-weight: 700; font-size: .8rem; padding: .1rem .45rem; border-radius: 3px; }
        .day-badge.ok { background: #d1e7dd; color: #0f5132; }
        .day-badge.bad { background: #f8d7da; color: #842029; }
        .empty-tip {
            text-align: center;
            color: #6c757d;
            padding: 2.2rem 1rem;
            font-size: .9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark navbar-hna">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-airplane"></i> 海航随心飞航线
            </a>
            <div class="navbar-nav ms-auto flex-row">
                <a class="nav-link px-2" href="index.html">航线查询</a>
                <span class="navbar-text text-white-50 px-1">|</span>
                <span class="navbar-text text-white small px-2 fw-semibold">行程规划</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3 mb-5 px-3 px-lg-4">
        <div class="alert alert-light border py-2 px-3 mb-3" style="font-size:.875rem;">
            <i class="bi bi-info-circle"></i>
            按顺序添加航段（如 北京 → 西安 → 海口 → 北京），城市框可直接输入名称搜索；选择出行日期后自动核对当天航班。无直飞时会推荐同区域机场和中转方案。海航随心飞单次行程限 3 个航段，超出仅提醒、不影响规划。
        </div>

        <div class="row g-3">
            <!-- 左侧：行程编辑 -->
            <div class="col-lg-5 col-xl-4">
                <div class="panel">
                    <div class="d-flex align-items-center mb-2">
                        <h6 class="mb-0"><i class="bi bi-map"></i> 我的行程</h6>
                        <div class="product-chip-group btn-group btn-group-sm ms-auto" role="group">
                            <button type="button" class="btn btn-outline-hna" data-product="all">所有</button>
                            <button type="button" class="btn btn-outline-hna" data-product="666">666</button>
                            <button type="button" class="btn btn-outline-hna" data-product="2666">2666</button>
                        </div>
                    </div>
                    <div id="limit-warning" class="limit-warning">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span id="limit-warning-text"></span>
                    </div>
                    <div id="seg-list"></div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-sm btn-outline-secondary" id="btn-add"><i class="bi bi-plus-lg"></i> 添加航段</button>
                        <button class="btn btn-sm btn-outline-secondary" id="btn-close-loop"><i class="bi bi-arrow-repeat"></i> 闭环回起点</button>
                        <button class="btn btn-sm btn-outline-secondary ms-auto" id="btn-clear"><i class="bi bi-x-lg"></i> 清空</button>
                    </div>
                </div>
            </div>

            <!-- 右侧：规划结果 -->
            <div class="col-lg-7 col-xl-8">
                <div class="panel mb-3">
                    <h6><i class="bi bi-signpost-split"></i> 行程概览</h6>
                    <div class="chain-box" id="chain-view"><span class="text-muted small">尚未添加航段</span></div>
                </div>
                <div id="result-list">
                    <div class="panel empty-tip">
                        <i class="bi bi-airplane-engines" style="font-size:2rem;"></i>
                        <div class="mt-2">添加航段后，这里会显示每段的可用航班</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="trip-planner.js"></script>
</body>
</html>
