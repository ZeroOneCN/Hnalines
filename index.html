<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海航随心飞航线 - 2026冬春航季</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --hna-primary: #e60012;
            --hna-dark: #b0000e;
            --hna-border: #dee2e6;
        }
        body {
            background: #fff;
            color: #212529;
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        }
        .navbar-hna {
            background-color: var(--hna-primary);
        }
        .navbar-hna .navbar-brand { font-size: 1.05rem; }
        .notice-bar {
            background: #f8f9fa;
            border: 1px solid var(--hna-border);
            border-radius: 4px;
            padding: 0.55rem 0.9rem;
            font-size: 0.9rem;
        }
        .stats-card {
            background: #f8f9fa;
            border: 1px solid var(--hna-border);
            border-radius: 4px;
            text-align: center;
            padding: 0.9rem 0.5rem;
        }
        .stats-card .label {
            font-size: 0.875rem;
            color: #495057;
        }
        .stats-card .num {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.25;
        }
        .stats-card .sub {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .table-hna { font-size: 0.875rem; }
        .table-hna thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f8f9fa;
            border-bottom: 2px solid var(--hna-border);
            white-space: nowrap;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            user-select: none;
        }
        .table-hna thead th:hover { color: var(--hna-primary); }
        .table-hna thead th .sort-icon { font-size: 0.75em; color: #ced4da; }
        .table-hna thead th.sorted-asc .sort-icon,
        .table-hna thead th.sorted-desc .sort-icon { color: var(--hna-primary); }
        .table-hna td { white-space: nowrap; vertical-align: middle; }
        .table-hna tbody tr:hover { background-color: #f8f9fa; }
        .btn-hna { background-color: var(--hna-primary); color: #fff; border-color: var(--hna-primary); }
        .btn-hna:hover { background-color: var(--hna-dark); border-color: var(--hna-dark); color: #fff; }
        .btn-outline-hna { color: var(--hna-primary); border-color: var(--hna-primary); }
        .btn-outline-hna:hover { background-color: var(--hna-primary); color: #fff; }
        .product-chip-group .btn { padding: 0.2rem 0.8rem; }
        .pagination .page-link { color: var(--hna-primary); }
        .pagination .page-link:hover { color: #fff; background-color: var(--hna-primary); border-color: var(--hna-primary); }
        .page-item.active .page-link { background-color: var(--hna-primary); border-color: var(--hna-primary); }
        .page-item.disabled .page-link { color: #bbb; }
        .modal-header { border-bottom-color: var(--hna-border); }
        .text-hna { color: var(--hna-primary) !important; }
        .bg-hna { background-color: var(--hna-primary) !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark navbar-hna">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-airplane"></i> 海航随心飞航线
            </a>
            <span class="navbar-text text-white-50 d-none d-md-inline small">2026冬春航季 · 海航PLUS适用航班</span>
            <button type="button" class="btn btn-link text-white position-relative ms-auto" id="notice-bell" title="站点通知" style="text-decoration: none;">
                <i class="bi bi-bell"></i>
                <span class="position-absolute bg-warning rounded-circle" id="notice-dot" style="width:8px; height:8px; top:6px; right:4px; display:none;"></span>
            </button>
        </div>
    </nav>

    <div class="container mt-3 mb-5">
        <div class="notice-bar mb-2">
            <strong>海航 PLUS 会员权益卡适用航班参考列表</strong>（2026冬春航季：2026.10.25 - 2027.03.27）
        </div>
        <div class="notice-bar mb-3">
            数据采集于海南航空官方，具体票务信息以官方为准，本站仅供参考
        </div>

        <div class="row mb-3 g-2">
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="label"><i class="bi bi-collection"></i> 总航线数</div>
                    <div class="num" id="total-flights">-</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="label"><i class="bi bi-calendar"></i> 数据版本</div>
                    <div class="num fs-4" id="data-version">-</div>
                    <div class="sub" id="season-text"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="label"><i class="bi bi-geo-alt"></i> 覆盖省份</div>
                    <div class="num" id="total-provinces">-</div>
                </div>
            </div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-md-6 col-lg-4">
                <select id="province-filter" class="form-select">
                    <option value="all">所有省份</option>
                </select>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="input-group">
                    <input type="text" id="search-input" class="form-control" placeholder="搜索航班号、出发地、目的地...">
                </div>
            </div>
        </div>
        <div class="row g-2 mb-3 align-items-center">
            <div class="col-md-4 col-lg-3">
                <select id="dep-city-filter" class="form-select">
                    <option value="all">所有出港城市</option>
                </select>
            </div>
            <div class="col-md-4 col-lg-3">
                <select id="arr-city-filter" class="form-select">
                    <option value="all">所有到港城市</option>
                </select>
            </div>
            <div class="col-md-4 col-lg-6 d-flex justify-content-md-end align-items-center flex-wrap gap-2">
                <span class="text-muted small">产品:</span>
                <div class="product-chip-group btn-group" role="group">
                    <button type="button" class="btn btn-sm btn-outline-hna" data-product="all" id="product-all">所有</button>
                    <button type="button" class="btn btn-sm btn-outline-hna" data-product="666" id="product-666">666</button>
                    <button type="button" class="btn btn-sm btn-outline-hna" data-product="2666" id="product-2666">2666</button>
                </div>
                <span class="text-muted small" id="result-count"></span>
                <button class="btn btn-sm btn-outline-secondary" onclick="resetFilters()" title="清空所有筛选条件">
                    <i class="bi bi-arrow-counterclockwise"></i> 重置
                </button>
                <button class="btn btn-sm btn-outline-hna" onclick="loadStatistics()" title="查看各省份航线分布统计">
                    <i class="bi bi-bar-chart"></i> 查看统计
                </button>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-hna" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2 text-muted">正在加载航线数据...</p>
        </div>
        <div class="table-responsive" id="table-wrap" style="display: none; max-height: 64vh;">
            <table class="table table-sm table-striped table-hover table-hna mb-0" id="flights-table">
                <thead>
                    <tr>
                        <th data-sort="flight_number">航班号 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="departure_city">出港城市 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="arrival_city">到港城市 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="departure_time">出发时刻 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="schedule">班期 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="date_range">适用日期段 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="product">产品 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="departure_province">出港省份 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th data-sort="arrival_province">到港省份 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                    </tr>
                </thead>
                <tbody id="flights-container"></tbody>
            </table>
        </div>
        <div id="pagination" class="text-center my-3" style="display: none;"></div>
        <div id="no-data" class="text-center py-5" style="display: none;">
            <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
            <p class="text-muted mb-0">暂无符合条件的航线数据</p>
        </div>

        <footer class="text-center text-muted small mt-4">
            海航随心飞航线查询 · 数据版本 <span id="footer-version">-</span>
        </footer>
    </div>

    <div class="modal fade" id="noticeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h5 class="modal-title text-hna fs-6"><i class="bi bi-megaphone"></i> <span id="notice-title"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="notice-body" style="white-space: pre-line;"></div>
                <div class="modal-footer py-2">
                    <small class="text-muted me-auto" id="notice-date"></small>
                    <button type="button" class="btn btn-sm btn-hna" data-bs-dismiss="modal" id="notice-ok">我知道了</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="statisticsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-hna">航线统计信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="statistics-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="app.js?v=20261012"></script>
</body>
</html>
